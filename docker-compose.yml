# تشغيل اللعبة على سيرفر خاص (VPS) مع HTTPS تلقائي
#
#   docker compose up -d --build
#
# بدون دومين: تشتغل على http://IP-السيرفر
# مع دومين:   بدّل السطر الأول بالـCaddyfile لاسم دومينك، وCaddy يجيب SSL لحاله.

services:
  app:
    build: .
    restart: unless-stopped
    environment:
      PORT: "3000"
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
